name: Contract Deployment

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network'
        required: true
        type: choice
        options:
          - testnet
          - mainnet
      contract:
        description: 'Contract to deploy (or "all")'
        required: true
        type: choice
        options:
          - all
          - timelock-exchange
          - fee-collector
          - position-nft
          - staking-rewards
          - governance

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.approval.outputs.proceed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Clarinet
        run: |
          curl -L https://github.com/hirosystems/clarinet/releases/download/v2.6.0/clarinet-linux-x64.tar.gz | tar xz
          sudo mv clarinet /usr/local/bin/

      - name: Validate contracts
        run: |
          echo "Validating contracts..."
          clarinet check
          
      - name: Run full test suite
        run: |
          npm ci
          npm run test:contracts

      - name: Check deployment plan
        id: check-plan
        run: |
          PLAN_FILE="deployments/default.${{ inputs.network }}-plan.yaml"
          if [ -f "$PLAN_FILE" ]; then
            echo "Deployment plan found: $PLAN_FILE"
            echo "plan_exists=true" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Deployment plan not found"
            exit 1
          fi

      - name: Approval gate
        id: approval
        run: |
          if [ "${{ inputs.network }}" = "mainnet" ]; then
            echo "⚠️ MAINNET DEPLOYMENT REQUESTED"
            echo "This requires manual approval"
            echo "proceed=pending" >> $GITHUB_OUTPUT
          else
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to ${{ inputs.network }}
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.network }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          curl -L https://github.com/hirosystems/clarinet/releases/download/v2.6.0/clarinet-linux-x64.tar.gz | tar xz
          sudo mv clarinet /usr/local/bin/

      - name: Configure deployment
        run: |
          echo "Network: ${{ inputs.network }}"
          echo "Contract: ${{ inputs.contract }}"
          
          # Set network URL
          if [ "${{ inputs.network }}" = "mainnet" ]; then
            echo "STACKS_API=https://api.mainnet.hiro.so" >> $GITHUB_ENV
          else
            echo "STACKS_API=https://api.testnet.hiro.so" >> $GITHUB_ENV
          fi

      - name: Deploy contracts
        run: |
          echo "Deploying to ${{ inputs.network }}..."
          
          PLAN_FILE="deployments/default.${{ inputs.network }}-plan.yaml"
          
          if [ "${{ inputs.contract }}" = "all" ]; then
            echo "Deploying all contracts..."
            # clarinet deployments apply -p $PLAN_FILE
          else
            echo "Deploying ${{ inputs.contract }}..."
            # Filter deployment plan for specific contract
            # clarinet deployments apply -p $PLAN_FILE --contract ${{ inputs.contract }}
          fi
        env:
          STACKS_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}

      - name: Verify deployment
        run: |
          echo "Verifying deployment on ${{ inputs.network }}..."
          
          # Verify each deployed contract
          CONTRACTS=("timelock-exchange" "fee-collector" "position-nft" "staking-rewards" "governance")
          
          for contract in "${CONTRACTS[@]}"; do
            if [ "${{ inputs.contract }}" = "all" ] || [ "${{ inputs.contract }}" = "$contract" ]; then
              echo "Verifying $contract..."
              # Add verification logic here
            fi
          done

      - name: Update deployment record
        run: |
          echo "Recording deployment..."
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Network: ${{ inputs.network }}"
          echo "Contract: ${{ inputs.contract }}"
          echo "Commit: ${{ github.sha }}"

      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Network | ${{ inputs.network }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | ${{ inputs.contract }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +"%Y-%m-%dT%H:%M:%SZ") |" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Notify on success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Deployment successful!"
          # Send success notification

      - name: Notify on failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          # Send failure notification
